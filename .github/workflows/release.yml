name: GitHub release

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example, v0.1.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag and extension version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$RELEASE_TAG" != "v${version}" ]]; then
            echo "Tag must be v${version} and match the extension version." >&2
            exit 1
          fi
      - run: npm ci
      - name: Package stable VSIX
        run: npm run build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.vsix --verify-tag --generate-notes
